<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Demolitions Map</title>
<!-- Apartment demolitions in Atlanta's northern suburbs, 2010-2017. Embedded on /Projects/suburbs/.
     Data: assets/data/atl_demolitions.json (sites + city boundaries, extracted from the old R leaflet export).
     Basemap: Esri World Imagery (keyless). It is dimmed at overview zooms so the circles read,
     and shown at full strength once you zoom in to a site. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Darker+Grotesque:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --panel: rgba(17, 20, 24, .86);
    --panel-solid: #15181d;
    --ink: #f1f2f4;
    --muted: #a9b0b9;
    --rule: rgba(255, 255, 255, .14);
    --site: #ff5a3c;          /* demolished complexes */
    --hisp: #3987e5; --black: #199e70; --white: #c98500; --asian: #d55181; --other: #7d828a;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Darker Grotesque", var(--sans);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0f12; color: var(--ink); font-family: var(--sans); }
  #map { position: absolute; inset: 0; background: #0d0f12; }
  .leaflet-container { font-family: var(--sans); }

  /* imagery: dim and desaturate at overview zooms so the data leads; full color on the ground */
  .imagery { transition: filter .6s ease; }
  #map.z-far .imagery { filter: saturate(.45) brightness(.55) contrast(1.08); }
  #map.z-mid .imagery { filter: saturate(.7) brightness(.75); }
  #map.z-ground .imagery { filter: none; }

  /* title panel */
  .panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px; width: 292px; max-width: calc(100% - 70px);
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
    font-size: 13px; line-height: 1.45;
  }
  .panel summary { list-style: none; cursor: pointer; padding: 14px 16px 12px; }
  .panel summary::-webkit-details-marker { display: none; }
  .kicker { margin: 0 0 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--site); }
  .panel h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1; letter-spacing: -.005em; display: flex; justify-content: space-between; gap: 8px; }
  .panel h1::after { content: "\2013"; font-family: var(--sans); font-size: 18px; color: var(--muted); }
  .panel:not([open]) h1::after { content: "+"; }
  .panel-body { padding: 0 16px 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0 0 12px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stats b { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: 11.5px; }
  .size-key { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
  .size-key svg { flex: none; overflow: visible; }
  .size-key circle { fill: var(--site); fill-opacity: .85; stroke: #fff; stroke-width: 1.2; }
  .size-key text { fill: var(--muted); font-size: 10.5px; }
  .size-key p { margin: 0; color: var(--muted); font-size: 11.5px; }
  .boundary-key { display: flex; gap: 14px; color: var(--muted); font-size: 11.5px; margin-bottom: 12px; }
  .boundary-key i { display: inline-block; width: 18px; vertical-align: 3px; margin-right: 6px; border-top: 2px solid #fff; }
  .boundary-key i.dash { border-top: 2px dashed rgba(255, 255, 255, .6); }
  select {
    width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: rgba(255, 255, 255, .08);
    border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; cursor: pointer;
  }
  select option, select optgroup { color: #111; background: #fff; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 11.5px; }

  /* reset-view button, styled like the zoom control */
  .reset-btn a { font-size: 15px; }

  /* city labels */
  .city-label { pointer-events: none; }
  .city-label span {
    display: block; transform: translate(-50%, -50%); white-space: nowrap;
    font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #fff;
    text-shadow: 0 0 3px #000, 0 0 8px rgba(0, 0, 0, .8);
  }
  .city-label.context span { font-weight: 500; font-style: italic; letter-spacing: .1em; color: rgba(255, 255, 255, .7); }
  #map.z-ground .city-label { display: none; }

  /* site name labels: shown on hover, and always once zoomed in */
  .leaflet-tooltip.site-label {
    background: rgba(17, 20, 24, .88); color: var(--ink); border: 0; border-radius: 4px; box-shadow: none;
    padding: 3px 7px; font-size: 12px; font-weight: 600; visibility: hidden;
  }
  .leaflet-tooltip.site-label::before { display: none; }
  .leaflet-tooltip.site-label.show, #map.z-ground .leaflet-tooltip.site-label, #map.z-mid .leaflet-tooltip.site-label.big { visibility: visible; }
  .leaflet-tooltip.site-label.show { z-index: 10; }
  #map.z-ground ~ .panel .size-key { display: none; }

  /* popups */
  .leaflet-popup-content-wrapper { background: var(--panel-solid); color: var(--ink); border-radius: 10px; border: 1px solid var(--rule); box-shadow: 0 8px 28px rgba(0, 0, 0, .45); }
  .leaflet-popup-tip { background: var(--panel-solid); }
  .leaflet-popup-content { margin: 14px 16px 14px; font-size: 13px; line-height: 1.4; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); top: 6px; right: 6px; }
  .pop-k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .pop h3 { margin: 2px 0 8px; font-family: var(--display); font-size: 23px; line-height: 1; font-weight: 700; padding-right: 14px; }
  .pop-n { margin-bottom: 10px; color: var(--muted); }
  .pop-n b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar-label { font-size: 11px; color: var(--muted); margin: 6px 0 3px; }
  .bar { display: flex; gap: 2px; height: 12px; }
  .bar i { display: block; height: 100%; min-width: 2px; }
  .bar i:first-child { border-radius: 4px 0 0 4px; }
  .bar i:last-child { border-radius: 0 4px 4px 0; }
  .groups { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-variant-numeric: tabular-nums; }
  .groups li { display: contents; }
  .groups span:first-child::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; background: var(--c); }
  .groups span:last-child { text-align: right; color: var(--muted); }
  .groups b { color: var(--ink); font-weight: 600; }
  .pop-go {
    margin-top: 12px; width: 100%; font: inherit; font-size: 12.5px; font-weight: 600; color: #fff; cursor: pointer;
    background: var(--site); border: 0; border-radius: 6px; padding: 7px 10px;
  }
  .pop-go:hover { filter: brightness(1.1); }

  .leaflet-control-attribution { background: rgba(17, 20, 24, .7) !important; color: var(--muted); font-size: 10px; }
  .leaflet-control-attribution a { color: #cfd5dc; }
  .leaflet-control-scale-line { background: rgba(17, 20, 24, .6); color: var(--ink); border-color: var(--ink); }

  @media (max-width: 520px), (max-height: 460px) {
    .panel { width: 250px; }
    .panel summary { padding: 10px 12px 9px; }
    .panel h1 { font-size: 21px; }
    .panel-body { padding: 0 12px 12px; }
    .stats b { font-size: 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of apartment complexes demolished in Atlanta's northern suburbs, 2010 to 2017"></div>

<details class="panel" id="panel" open>
  <summary>
    <p class="kicker">Atlanta&rsquo;s northern suburbs</p>
    <h1>Apartments demolished, 2010&ndash;2017</h1>
  </summary>
  <div class="panel-body">
    <div class="stats">
      <div><b id="n-sites">18</b><span>complexes</span></div>
      <div><b id="n-units">3,885</b><span>units</span></div>
      <div><b id="n-pop">9,091</b><span>residents</span></div>
    </div>
    <div class="size-key">
      <svg id="size-key" width="80" height="60" aria-hidden="true"></svg>
      <p>Circle size: estimated residents in 2010</p>
    </div>
    <div class="boundary-key"><span><i></i>City limits</span><span><i class="dash"></i>Atlanta</span></div>
    <label for="jump" class="hint" style="display:block;margin:0 0 4px">Go to a complex</label>
    <select id="jump"><option value="">Choose a complex&hellip;</option></select>
    <p class="hint">Click a circle to see who lived there, or a city for its demographics. Zoom in on a site to see what stands there now.</p>
  </div>
</details>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var GROUPS = [
    ["Hispanic", "--hisp"], ["Black", "--black"], ["White", "--white"], ["Asian & P.I.", "--asian"], ["Other", "--other"]
  ];
  var MID_ZOOM = 13, GROUND_ZOOM = 15, SITE_ZOOM = 17;
  var narrow = window.innerWidth < 560;
  var panel = document.getElementById("panel");
  if (narrow || window.innerHeight < 460) panel.open = false;

  var map = L.map("map", { zoomControl: false, scrollWheelZoom: true, zoomSnap: 0.5, minZoom: 9, maxZoom: 19 })
    .setView([33.93, -84.44], 11);   // placeholder until the data loads and home() fits it
  L.control.zoom({ position: "topright" }).addTo(map);
  L.control.scale({ position: "bottomleft", maxWidth: 110 }).addTo(map);
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, className: "imagery",
    attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics &middot; Data: Markley (2018), <a href=\"https://doi.org/10.18737/atls20181030\" target=\"_blank\" rel=\"noopener\"><em>Atlanta Studies</em></a>"
  }).addTo(map);
  // road names help people find their bearings on the imagery; too busy at overview zooms
  var roads = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, opacity: 0.45
  });

  map.createPane("cities").style.zIndex = 410;
  map.createPane("sites").style.zIndex = 450;

  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  function pct(p) { return p < 1 && p > 0 ? "<1%" : Math.round(p) + "%"; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function bar(shares) {
    return '<div class="bar">' + GROUPS.map(function (g) {
      var v = shares[g[0]];
      return v > 0 ? '<i style="flex:' + v + ';background:' + css(g[1]) + '" title="' + esc(g[0]) + " " + pct(v) + '"></i>' : "";
    }).join("") + "</div>";
  }

  // circle radius in px: area proportional to residents, growing with zoom until the site view
  var maxPop = 1;
  function maxRadius(z) { return Math.min(44, 20 * Math.pow(1.3, z - 11)); }
  function radius(pop, z) { return Math.max(5, Math.sqrt(pop / maxPop) * maxRadius(z)); }

  fetch("/assets/data/atl_demolitions.json").then(function (r) { return r.json(); }).then(function (data) {
    var sites = data.sites;
    maxPop = Math.max.apply(null, sites.map(function (s) { return s.pop; }));

    document.getElementById("n-sites").textContent = sites.length;
    document.getElementById("n-units").textContent = fmt(sites.reduce(function (a, s) { return a + s.units; }, 0));
    document.getElementById("n-pop").textContent = fmt(sites.reduce(function (a, s) { return a + s.pop; }, 0));

    // ---- city boundaries ----
    var suburbBounds = L.latLngBounds([]);
    data.cities.forEach(function (c) {
      var context = c.name === "Atlanta";
      L.polygon(c.rings, { pane: "cities", interactive: false, color: "#000", weight: 5, opacity: 0.35, fill: false }).addTo(map);
      var poly = L.polygon(c.rings, {
        pane: "cities", color: "#fff", weight: context ? 1.3 : 1.8, opacity: context ? 0.6 : 0.95,
        dashArray: context ? "5 5" : null, fill: true, fillColor: "#fff", fillOpacity: 0
      }).addTo(map);
      poly.on("mouseover", function () { poly.setStyle({ fillOpacity: 0.07, weight: context ? 2 : 2.8 }); });
      poly.on("mouseout", function () { poly.setStyle({ fillOpacity: 0, weight: context ? 1.3 : 1.8 }); });

      var s10 = c.pct10, s20 = c.pct20;
      poly.bindPopup(
        '<div class="pop"><div class="pop-k">City demographics</div><h3>' + esc(c.name) + "</h3>" +
        '<div class="pop-n"><b>' + fmt(c.pop10) + "</b> &rarr; <b>" + fmt(c.pop20) + "</b> residents, 2010&ndash;2020</div>" +
        '<div class="bar-label">2010</div>' + bar(s10) + '<div class="bar-label">2020</div>' + bar(s20) +
        '<ul class="groups">' + GROUPS.map(function (g) {
          return '<li><span style="--c:' + css(g[1]) + '">' + esc(g[0]) + "</span><span>" + pct(s10[g[0]]) + " &rarr; <b>" + pct(s20[g[0]]) + "</b></span></li>";
        }).join("") + "</ul></div>",
        { maxWidth: 270, minWidth: 230 }
      );

      if (!context) suburbBounds.extend(poly.getBounds());
      L.marker(context ? [33.805, -84.405] : labelPoint(c), {
        interactive: false, keyboard: false,
        icon: L.divIcon({ className: "city-label" + (context ? " context" : ""), html: "<span>" + esc(c.name) + "</span>", iconSize: [0, 0] })
      }).addTo(map);
    });

    // ---- demolished complexes ----
    var markers = [];
    sites.slice().sort(function (a, b) { return b.pop - a.pop; }).forEach(function (s) {
      var total = GROUPS.reduce(function (a, g) { return a + s.race[g[0]]; }, 0);
      var shares = {};
      GROUPS.forEach(function (g) { shares[g[0]] = 100 * s.race[g[0]] / total; });

      var m = L.circleMarker([s.lat, s.lng], { pane: "sites", radius: radius(s.pop, 11) }).addTo(map);
      m.site = s;
      m.bindTooltip(esc(s.name), {
        permanent: true, direction: "bottom", offset: [0, 4], className: "site-label" + (s.pop >= 700 ? " big" : "")
      });
      m.on("mouseover", function () { m.getTooltip().getElement().classList.add("show"); });
      m.on("mouseout", function () { m.getTooltip().getElement().classList.remove("show"); });
      m.bindPopup(
        '<div class="pop"><div class="pop-k">' + esc(s.city) + " &middot; demolished " + s.year + "</div>" +
        "<h3>" + esc(s.name) + "</h3>" +
        '<div class="pop-n"><b>' + fmt(s.pop) + "</b> residents in 2010 &middot; " + fmt(s.units) + " units" +
        (s.owner === "public" ? ", public housing" : "") + "</div>" +
        bar(shares) +
        '<ul class="groups">' + GROUPS.map(function (g) {
          return '<li><span style="--c:' + css(g[1]) + '">' + esc(g[0]) + "</span><span><b>" + pct(shares[g[0]]) + "</b> &middot; " + fmt(s.race[g[0]]) + "</span></li>";
        }).join("") + "</ul>" +
        '<button class="pop-go" type="button">See the site now &rarr;</button></div>',
        { maxWidth: 270, minWidth: 230 }
      );
      m.on("popupopen", function (e) {
        var btn = e.popup.getElement().querySelector(".pop-go");
        if (map.getZoom() >= SITE_ZOOM - 0.5) btn.style.display = "none";
        btn.onclick = function () { goTo(m); };
      });
      markers.push(m);
    });

    // ---- jump menu, grouped by city, in order of demolition ----
    var jump = document.getElementById("jump");
    Array.from(new Set(sites.map(function (s) { return s.city; }))).sort().forEach(function (city) {
      var og = document.createElement("optgroup");
      og.label = city;
      markers.filter(function (m) { return m.site.city === city; })
        .sort(function (a, b) { return a.site.year - b.site.year || a.site.name.localeCompare(b.site.name); })
        .forEach(function (m) {
          var o = document.createElement("option");
          o.value = markers.indexOf(m);
          o.textContent = m.site.name + " (" + m.site.year + ")";
          og.appendChild(o);
        });
      jump.appendChild(og);
    });
    jump.addEventListener("change", function () {
      if (jump.value !== "") goTo(markers[+jump.value]);
      if (narrow) panel.open = false;
    });

    function goTo(m) {
      map.closePopup();
      map.flyTo(m.getLatLng(), SITE_ZOOM, { duration: 1.4 });
      map.once("moveend", function () { m.openPopup(); });
    }

    // ---- zoom-dependent styling ----
    function restyle() {
      var z = map.getZoom(), ground = z >= GROUND_ZOOM;
      var el = map.getContainer();
      el.classList.toggle("z-far", z < MID_ZOOM);
      el.classList.toggle("z-mid", z >= MID_ZOOM && !ground);
      el.classList.toggle("z-ground", ground);
      if (z >= MID_ZOOM) roads.addTo(map); else roads.remove();
      var rz = Math.min(z, GROUND_ZOOM - 1);
      markers.forEach(function (m) {
        // on the ground, circles become open rings so the imagery shows through
        m.setStyle(ground
          ? { radius: Math.max(22, radius(m.site.pop, rz)), color: css("--site"), weight: 3, opacity: 1, fillColor: css("--site"), fillOpacity: 0.08 }
          : { radius: radius(m.site.pop, z), color: "#fff", weight: 1.5, opacity: 0.95, fillColor: css("--site"), fillOpacity: 0.85 });
        m.getTooltip().options.offset = [0, ground ? 2 : 4];
      });
      drawSizeKey(ground ? rz : z);
    }

    function drawSizeKey(z) {
      var svg = document.getElementById("size-key"), vals = [250, 750, 1750];
      var rMax = radius(vals[2], z), h = 2 * rMax + 2, w = 2 * rMax + 46;
      // labels sit at least 12px apart, largest first, with a leader to the top of each circle
      var ty = -1e9, lead = "", circles = "", labels = "";
      vals.slice().reverse().forEach(function (v) {
        var r = radius(v, z), top = h - 1 - 2 * r;
        ty = Math.max(top, ty + 12);
        circles = '<circle cx="' + (rMax + 1) + '" cy="' + (h - 1 - r) + '" r="' + r + '"/>' + circles;
        lead += '<polyline fill="none" points="' + (rMax + 1) + "," + top + " " + (2 * rMax + 2) + "," + top + " " + (2 * rMax + 6) + "," + ty + '" stroke="rgba(255,255,255,.35)" stroke-width="1"/>';
        labels += '<text x="' + (2 * rMax + 9) + '" y="' + (ty + 3.5) + '">' + fmt(v) + "</text>";
      });
      svg.setAttribute("width", w); svg.setAttribute("height", Math.max(h, ty + 6));
      svg.innerHTML = circles + lead + labels;
    }

    map.on("zoomend", restyle);

    // ---- reset view ----
    function home() {
      var padLeft = panel.open && !narrow ? 300 : 10;
      map.fitBounds(suburbBounds, { paddingTopLeft: [padLeft, 16], paddingBottomRight: [16, 16] });
    }
    var Reset = L.Control.extend({
      options: { position: "topright" },
      onAdd: function () {
        var div = L.DomUtil.create("div", "leaflet-bar reset-btn");
        div.innerHTML = '<a href="#" title="Show all sites" role="button" aria-label="Show all sites">&#8962;</a>';
        L.DomEvent.on(div.firstChild, "click", function (e) { L.DomEvent.preventDefault(e); map.closePopup(); home(); });
        L.DomEvent.disableClickPropagation(div);
        return div;
      }
    });
    new Reset().addTo(map);

    home();
    restyle();
  });

  // label point for a city: centroid of its largest ring
  function labelPoint(c) {
    var best = null, bestA = 0;
    c.rings.forEach(function (ring) {
      var a = 0, x = 0, y = 0;
      for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        var f = ring[j][1] * ring[i][0] - ring[i][1] * ring[j][0];
        a += f; x += (ring[j][1] + ring[i][1]) * f; y += (ring[j][0] + ring[i][0]) * f;
      }
      if (Math.abs(a) > bestA) { bestA = Math.abs(a); best = [y / (3 * a), x / (3 * a)]; }
    });
    return best;
  }
})();
</script>
</body>
</html>
